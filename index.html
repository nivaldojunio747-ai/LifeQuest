<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeQuest Ultra - Edição Lendária</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #22c55e; --text: #f8fafc; --rare: #a855f7; --epic: #f59e0b; --store: #3b82f6; --danger: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 450px; padding: 20px; }
        
        /* Banners */
        .header { background: #1e293b; padding: 25px 20px; border-radius: 24px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; position: relative; overflow: hidden; transition: 0.5s; }
        .banner-default { background: #1e293b; }
        .banner-emerald { background: linear-gradient(135deg, #064e3b 0%, #1e293b 100%); border: 1px solid #10b981 !important; }
        .banner-royal { background: linear-gradient(135deg, #4c1d95 0%, #1e293b 100%); border: 1px solid #8b5cf6 !important; }
        .banner-gold { background: linear-gradient(135deg, #78350f 0%, #1e293b 100%); border: 1px solid #f59e0b !important; box-shadow: inset 0 0 20px rgba(245,158,11,0.2); }
        .banner-void { background: linear-gradient(135deg, #000000 0%, #1e293b 100%); border: 1px solid #3b82f6 !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 5px #3b82f6; } 50% { box-shadow: 0 0 20px #3b82f6; } 100% { box-shadow: 0 0 5px #3b82f6; } }

        .lvl-badge { font-size: 38px; font-weight: 900; color: var(--primary); text-shadow: 0 0 15px rgba(34,197,94,0.4); }
        .xp-bar { background: #334155; height: 16px; border-radius: 8px; margin: 15px 0; overflow: hidden; border: 1px solid #475569; }
        #xp-fill { background: linear-gradient(90deg, var(--primary), #4ade80); height: 100%; width: 0%; transition: 1s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .streak-badge { position: absolute; top: 15px; right: 15px; background: rgba(245,158,11,0.1); color: var(--epic); padding: 6px 12px; border-radius: 14px; font-size: 12px; font-weight: bold; border: 1px solid var(--epic); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 14px; background: #1e293b; border: none; color: white; border-radius: 12px; cursor: pointer; font-weight: bold; opacity: 0.5; transition: 0.3s; }
        .tab-btn.active { opacity: 1; background: var(--primary); color: #064e3b; transform: translateY(-2px); }

        .page { display: none; animation: fadeIn 0.3s forwards; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .habit-card { background: var(--card); padding: 18px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #475569; transition: 0.2s; }
        .habit-card:active { transform: scale(0.98); }
        .habit-card.completed { opacity: 0.4; filter: grayscale(1); pointer-events: none; transform: translateX(10px); }
        .delete-btn { background: none; color: var(--danger); border: 1px solid var(--danger); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-size: 18px; }

        .ranking-item { padding: 15px; margin-bottom: 10px; border-radius: 16px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .rank-number { font-weight: 900; font-size: 18px; margin-right: 10px; width: 25px; }

        .btn-add { width: 100%; background: var(--primary); border: none; padding: 15px; border-radius: 12px; font-weight: bold; color: #064e3b; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(34,197,94,0.3); }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; }
    </style>
</head>
<body>
    <div class="app">
        <div id="main-header" class="header banner-default">
            <div class="streak-badge">🔥 <span id="streak-count">0</span> DIAS</div>
            <span id="player-title-display" style="font-size: 10px; color: var(--epic); font-weight: bold; letter-spacing: 1px;">RECRUTA</span>
            <div id="player-name-display" style="font-weight: bold; font-size: 22px; margin-top: 5px;">---</div>
            <div class="lvl-badge">Lvl <span id="lvl">1</span></div>
            <div class="xp-bar"><div id="xp-fill"></div></div>
            <div style="display:flex; justify-content: space-between; font-size: 13px; font-weight: bold;">
                <span>XP: <span id="current-xp">0</span> / <span id="next-lvl-xp">100</span></span>
                <span>💎 <span id="store-points">0</span></span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showPage('jogar', this)">QUESTS</button>
            <button class="tab-btn" onclick="showPage('loja', this)">SHOP</button>
            <button class="tab-btn" onclick="showPage('ranking', this)">RANK</button>
        </div>

        <div id="jogar" class="page active">
            <div id="timer-display" style="text-align:center; font-size:12px; margin-bottom:15px; color:var(--store); font-weight:bold;">RESET EM: --:--:--</div>
            <div style="background:#1e293b; padding:18px; border-radius:20px; margin-bottom:20px; border: 1px solid #334155;">
                <input type="text" id="habit-name" placeholder="O que você vai conquistar hoje?">
                <select id="habit-dif">
                    <option value="10">Fácil (+10 XP / 💎10)</option>
                    <option value="30">Médio (+30 XP / 💎30)</option>
                    <option value="60">Difícil (+60 XP / 💎60)</option>
                </select>
                <button class="btn-add" onclick="addHabit()">LANÇAR MISSÃO</button>
                <div id="limit-text" style="font-size: 11px; margin-top: 10px; color: #94a3b8; text-align:center;"></div>
            </div>
            <div id="habit-list"></div>
        </div>

        <div id="loja" class="page">
            <h4 style="color:var(--store); margin-bottom:15px; border-left: 4px solid var(--store); padding-left: 10px;">TÍTULOS LENDÁRIOS</h4>
            <div id="title-store"></div>
            <h4 style="color:var(--rare); margin: 25px 0 15px 0; border-left: 4px solid var(--rare); padding-left: 10px;">BANNERS DE STATUS</h4>
            <div id="banner-store"></div>
        </div>

        <div id="ranking" class="page">
            <h3 style="text-align: center; margin-bottom: 20px;">🏆 TOP 10 MUNDIAL</h3>
            <div id="leaderboard"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAgKQSjBl1PeanAI5G_-zbdCdT8UvMz138",
            authDomain: "firequest-2bb44.firebaseapp.com",
            projectId: "firequest-2bb44",
            storageBucket: "firequest-2bb44.firebasestorage.app",
            messagingSenderId: "831345633283",
            appId: "1:831345633283:web:429438a8852ce452f80636"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let xpTotal = parseInt(localStorage.getItem('LQ_xpTotal')) || 0;
        let storePoints = parseInt(localStorage.getItem('LQ_storePoints')) || 0;
        let title = localStorage.getItem('LQ_title') || "Recruta";
        let banner = localStorage.getItem('LQ_banner') || "banner-default";
        let playerName = localStorage.getItem('LQ_name');
        let habits = JSON.parse(localStorage.getItem('LQ_habits')) || [];
        let streak = parseInt(localStorage.getItem('LQ_streak')) || 0;
        let lastDate = localStorage.getItem('LQ_lastDate');

        // BLOQUEADOR DE NICK REPETIDO
        async function checkAndSetName() {
            if(!playerName) {
                let name = prompt("Escolha seu Nick Único (não poderá ser mudado):");
                if(!name) name = "Guerreiro" + Math.floor(Math.random()*999);
                name = name.trim().substring(0, 15);

                const docRef = doc(db, "ranking", name);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    alert("Esse Nick já tem dono! Tente outro.");
                    return checkAndSetName();
                } else {
                    playerName = name;
                    localStorage.setItem('LQ_name', playerName);
                    await sync();
                }
            }
            render();
        }

        const titles = [{n:"Desbravador", p:300}, {n:"Veterano", p:800}, {n:"Mestre Ancestral", p:2000}, {n:"IMORTAL", p:5000}];
        const bannersArr = [{n:"Esmeralda", id:"banner-emerald", p:500}, {n:"Roxo Real", id:"banner-royal", p:1200}, {n:"Ouro Puro", id:"banner-gold", p:3000}, {n:"O VAZIO", id:"banner-void", p:7000}];

        function updateTimer() {
            const now = new Date();
            const tomorrow = new Date();
            tomorrow.setHours(24,0,0,0);
            const diff = tomorrow - now;
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `RESET EM: ${h}:${m}:${s}`;
            if(diff < 1000) location.reload();
        }
        setInterval(updateTimer, 1000);

        function getLevelData(xp) {
            let lvl = 1, req = 100, tmp = xp;
            while (tmp >= req) { tmp -= req; lvl++; req = Math.round(req * 1.6); }
            return { lvl, cur: tmp, next: req };
        }

        window.showPage = (id, btn) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        };

        window.addHabit = () => {
            const name = document.getElementById('habit-name').value.trim();
            const xpVal = parseInt(document.getElementById('habit-dif').value);
            if(habits.length >= 10) return alert("Sua agenda está lotada por hoje!");
            if(!name) return;
            habits.push({ name, xpVal, completed: false });
            document.getElementById('habit-name').value = "";
            save(); sync();
        };

        window.completeHabit = (i) => {
            if(habits[i].completed) return;
            habits[i].completed = true;
            xpTotal += habits[i].xpVal;
            storePoints += habits[i].xpVal;
            const today = new Date().toDateString();
            if (localStorage.getItem('LQ_lastStreakUpdate') !== today) { streak++; localStorage.setItem('LQ_lastStreakUpdate', today); }
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#22c55e', '#3b82f6', '#f59e0b'] });
            save(); sync();
        };

        window.deleteHabit = (i, e) => { e.stopPropagation(); habits.splice(i, 1); save(); };

        window.buyItem = (type, val, price) => {
            if(storePoints >= price) {
                storePoints -= price;
                if(type === 'title') title = val;
                if(type === 'banner') banner = val;
                save(); sync();
                confetti({ particleCount: 50, colors: ['#a855f7'] });
            }
        };

        function save() {
            localStorage.setItem('LQ_xpTotal', xpTotal);
            localStorage.setItem('LQ_storePoints', storePoints);
            localStorage.setItem('LQ_title', title);
            localStorage.setItem('LQ_banner', banner);
            localStorage.setItem('LQ_habits', JSON.stringify(habits));
            localStorage.setItem('LQ_streak', streak);
            render();
        }

        async function sync() {
            if(!playerName) return;
            const ld = getLevelData(xpTotal);
            await setDoc(doc(db, "ranking", playerName), { nome: playerName, xpTotal, titulo: title, banner, lvl: ld.lvl, streak });
        }

        function render() {
            if(!playerName) return;
            const ld = getLevelData(xpTotal);
            document.getElementById('player-name-display').innerText = playerName;
            document.getElementById('player-title-display').innerText = title;
            document.getElementById('lvl').innerText = ld.lvl;
            document.getElementById('xp-fill').style.width = (ld.cur / ld.next * 100) + "%";
            document.getElementById('current-xp').innerText = ld.cur;
            document.getElementById('next-lvl-xp').innerText = ld.next;
            document.getElementById('store-points').innerText = storePoints;
            document.getElementById('streak-count').innerText = streak;
            document.getElementById('main-header').className = "header " + banner;

            document.getElementById('limit-text').innerText = `Slots Disponíveis: ${10-habits.length}/10`;

            document.getElementById('habit-list').innerHTML = habits.map((h, i) => `
                <div class="habit-card ${h.completed?'completed':''}" style="border-left-color:${h.xpVal==10?'var(--primary)':h.xpVal==30?'var(--rare)':'var(--epic)'}">
                    <div style="flex:1" onclick="completeHabit(${i})">
                        <b style="font-size:16px;">${h.name}</b><br>
                        <small style="color:var(--store); font-weight:bold;">+${h.xpVal} XP / 💎${h.xpVal}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteHabit(${i}, event)">×</button>
                </div>`).join('');

            document.getElementById('title-store').innerHTML = titles.map(t => `<div class="store-item"><span><b>${t.n}</b><br><small>💎 ${t.p}</small></span><button class="buy-btn" ${storePoints<t.p?'disabled':''} onclick="buyItem('title','${t.n}',${t.p})">${title==t.n?'USANDO':'COMPRAR'}</button></div>`).join('');
            document.getElementById('banner-store').innerHTML = bannersArr.map(b => `<div class="store-item ${b.id}" style="border:1px solid #444"><span style="color:white;"><b>${b.n}</b><br><small>💎 ${b.p}</small></span><button class="buy-btn" ${storePoints<b.p?'disabled':''} onclick="buyItem('banner','${b.id}',${b.p})">${banner==b.id?'USANDO':'COMPRAR'}</button></div>`).join('');
        }

        onSnapshot(query(collection(db, "ranking"), orderBy("xpTotal", "desc"), limit(10)), (snap) => {
            const lb = document.getElementById('leaderboard'); lb.innerHTML = "";
            let p = 1;
            snap.forEach(doc => {
                const d = doc.data();
                const isMe = d.nome === playerName;
                lb.innerHTML += `
                <div class="ranking-item ${d.banner || 'banner-default'}" style="${isMe?'border:2px solid var(--primary); transform: scale(1.02);':''}">
                    <div style="display:flex; align-items:center;">
                        <span class="rank-number" style="color:${p==1?'#f59e0b':p==2?'#cbd5e1':p==3?'#92400e':'#94a3b8'}">#${p}</span>
                        <div><small style="color:var(--epic); font-size:10px; font-weight:bold;">${d.titulo}</small><br><b>${d.nome}</b></div>
                    </div>
                    <div style="text-align:right">
                        <b style="color:var(--primary)">Lvl ${d.lvl}</b><br>
                        <small>🔥 ${d.streak} dias</small>
                    </div>
                </div>`; p++;
            });
        });

        if(lastDate !== new Date().toDateString()) { habits = []; localStorage.setItem('LQ_lastDate', new Date().toDateString()); save(); }
        checkAndSetName();
    </script>
</body>
</html>
